# 風格預設（Style Presets）
# 在 Phase 2 時選擇，選擇後會自動套用到 ui-config.yaml > theme.colors
#
# NuxtUI 只支援 7 個語義色名：primary, secondary, success, info, warning, error, neutral
# 每個顏色值可以是：
#   - "#hex"   → 自訂色碼，Phase 2 會用 https://uicolors.app 產生 50-950 色階
#                 寫入 main.css 的 :root / .dark + @theme inline
#                 並在 app.config.ts 映射 {名稱}: '{名稱}'
#   - "名稱"   → Tailwind 內建色（如 emerald, amber, red, blue）
#                 Phase 2 只需在 app.config.ts 映射，不需產生 CSS
#
# 使用方式：
#   1. 選擇 light-default 或 dark-default 作為基底
#   2. 直接在 ui-config.yaml 的 theme.colors 填入自訂 hex 色碼
#   3. Phase 2 會根據色碼自動產生完整色階

# ---------------------------------------------------------------------------
# 1. light-default - 淺色主題基底
# 適合大多數應用，背景為淺色系
# ---------------------------------------------------------------------------
light-default:
  name: "light-default"
  description: "淺色主題基底，自行填入 hex 色碼定義品牌色彩"
  prefersDark: false
  colors:
    primary: "#00ba7b"      # 主色（青綠）
    secondary: "#7acc00"    # 輔色（萊姆綠）
    neutral: "#314157"      # 中性色（深藍灰）
    success: "#5ca300"      # 成功狀態（綠）
    warning: "#f34700"      # 警告狀態（橘紅）
    error: "#e50076"        # 錯誤狀態（桃紅）
    info: "#0082ce"         # 資訊提示（藍）

# ---------------------------------------------------------------------------
# 2. dark-default - 深色主題基底
# 適合儀表板、開發工具等深色介面
# ---------------------------------------------------------------------------
dark-default:
  name: "dark-default"
  description: "深色主題基底，自行填入 hex 色碼定義品牌色彩"
  prefersDark: true
  colors:
    primary: "#e50006"      # 主色（日落紅）
    secondary: "#000000"    # 輔色（純黑）
    neutral: "#09090b"      # 中性色（極深灰）
    success: "#009764"      # 成功狀態（青綠）
    warning: "#d08700"      # 警告狀態（琥珀）
    error: "#c50035"        # 錯誤狀態（深紅）
    info: "#135bf9"         # 資訊提示（寶藍）

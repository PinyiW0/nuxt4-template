    secondary: "#966fb3"
    tertiary: "#015355"
    accent: "#ffe999"
    success: "#18a34a"
    warning: "#d97708"
    error: "#ff7265"
    info: "#2563eb"
    neutral: "#05176c"
  darkModeDefault: true
  cardStyle: "glass"


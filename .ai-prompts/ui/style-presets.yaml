# 風格預設（Style Presets）
# 在 Phase 2 時選擇，選擇後會自動套用到 ui-config.yaml > theme.colors

# ---------------------------------------------------------------------------
# 1. dark-default - Dracula 暖調霓虹風，深棕背景配粉紅強調、紫色輔助
# ---------------------------------------------------------------------------
dark-default:
  name: "dark-default"
  description: "Dracula 暖調霓虹風，深棕暖灰背景配粉紅強調色，適合開發者工具、創意類應用"
  preview: "🧛"
  prefersDark: true
  colors:
    primary: "#ff79c6"
    secondary: "#bd93f9"
    accent: "#ffb86c"
    success: "#51fa7b"
    warning: "#f1fa8c"
    error: "#ff5555"
    info: "#8be9fd"
    neutral: "#414558"

# ---------------------------------------------------------------------------
# 2. light-default - 珊瑚柔暖風，淺藍灰背景配珊瑚紅主色、蜜桃色輔助
# ---------------------------------------------------------------------------
light-default:
  name: "light-default"
  description: "珊瑚柔暖風，淺藍灰背景配珊瑚紅主色、蜜桃色輔助，溫暖柔和適合通用型應用"
  preview: "🪸"
  prefersDark: false
  colors:
    primary: "#FF6F61"
    secondary: "#FFAB91"
    tertiary: "#E0E7EE"
    accent: "#E0E7EE"
    success: "#059669"
    warning: "#d97708"
    error: "#dc2626"
    info: "#2563eb"
    neutral: "#222831"
  darkModeDefault: false
  cardStyle: "soft"

# ---------------------------------------------------------------------------
# 3. dark-aqua - 深海青綠風，深藍背景配青綠主色、米黃點綴
# ---------------------------------------------------------------------------
dark-aqua:

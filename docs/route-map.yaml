generated_at: 2026-03-06
version: 3

# API 合約規格
api_contract:
  # 回傳格式慣例
  response_conventions:
    list: "{ status: 'success', data: T[], meta: { total, page, page_size } }"
    single: "{ status: 'success', data: T }"
    action: "{ status: 'success', message: '...' }"
    error: 'throw createError({ statusCode, message })'

  # 型別欄位快照（鏡像 app/types/api/*.ts，作為 Sync diff 基準）
  types:
    LoginRequest:
      file: auth.ts
      fields:
        account: string
        password: string
    LoginUser:
      file: auth.ts
      fields:
        id: number
        account: string
        role: string
    LoginData:
      file: auth.ts
      fields:
        access_token: string
        refresh_token: string
        user: LoginUser
    RefreshRequest:
      file: auth.ts
      fields:
        refresh_token: string
    RefreshData:
      file: auth.ts
      fields:
        access_token: string
    TeamItem:
      file: teams.ts
      fields:
        id: number
        name: string
        description: string
        player_count: number
        created_by: string
        created_at: string
        status: "'active' | 'deleted'"
    CreateTeamBody:
      file: teams.ts
      fields:
        name: string
        description: string?
    UpdateTeamBody:
      file: teams.ts
      fields:
        name: string
        description: string?
    PlayerItem:
      file: players.ts
      fields:
        id: number
        number: number
        name: string
        height: number
        position: string
        team_id: number
        team_name: string
        sort_order: number
        created_at: string
        status: "'active' | 'deleted'"
    CreatePlayerBody:
      file: players.ts
      fields:
        team_id: number
        number: number
        name: string
        height: number
        position: string
    UpdatePlayerBody:
      file: players.ts
      fields:
        number: number?
        name: string?
        height: number?
        position: string?
    TrainingItem:
      file: trainings.ts
      fields:
        id: number
        date: string
        player_name: string
        team_name: string
        pitch_count: number
        ai_status: "'running' | 'stopped'"
        created_by: string
        created_at: string
    TrainingDetail:
      file: trainings.ts
      fields:
        id: number
        date: string
        player_name: string
        team_name: string
        strike_zone_top: number
        strike_zone_bottom: number
        pitch_count: number
        ai_status: "'running' | 'stopped'"
        created_by: string
        created_at: string
    CreateTrainingBody:
      file: trainings.ts
      fields:
        date: string
        player_id: number
        strike_zone_top: number?
        strike_zone_bottom: number?
    UpdateStrikeZoneBody:
      file: trainings.ts
      fields:
        top: number
        bottom: number
    BatchDeleteBody:
      file: trainings.ts
      fields:
        ids: 'number[]'
    PitchItem:
      file: pitches.ts
      fields:
        id: number
        sequence: number
        time: string
        velocity: number
        spin_rate: number
        is_strike: boolean
        location_x: number
        location_y: number
    PitchDetail:
      file: pitches.ts
      fields:
        id: number
        sequence: number
        time: string
        velocity: number
        spin_rate: number
        is_strike: boolean
        location_x: number
        location_y: number
        trajectory_data: 'Record<string, unknown>'
    TrainingAnalysis:
      file: analysis.ts
      fields:
        total_pitches: number
        strike_count: number
        ball_count: number
        strike_rate: number
        avg_velocity: number
        max_velocity: number
        min_velocity: number
        avg_spin_rate: number
        heat_map: 'HeatMapPoint[]'
    HeatMapPoint:
      file: analysis.ts
      fields:
        x: number
        y: number
        density: number
    PlayerAnalyticsItem:
      file: analysis.ts
      fields:
        id: number
        name: string
        number: number
        team_name: string
        training_count: number
        total_pitches: number
        last_training_date: string
        avg_velocity: number
    PlayerStatsData:
      file: analysis.ts
      fields:
        avg_velocity: number
        avg_spin_rate: number
        strike_rate: number
        total_pitches: number
        heat_map: 'HeatMapPoint[]'
        period_start: string
        period_end: string
    BatchDeletePlayersAnalysisBody:
      file: analysis.ts
      fields:
        player_ids: 'number[]'

  # 端點規格
  endpoints:
    - method: POST
      path: /api/auth/login
      request: LoginRequest
      response: LoginData
    - method: POST
      path: /api/auth/refresh
      request: RefreshRequest
      response: RefreshData
    - method: POST
      path: /api/auth/logout
      request: null
      response: '{ message: string }'
    - method: GET
      path: /api/teams
      request: 'query: { page?, page_size? }'
      response: 'TeamItem[]'
    - method: POST
      path: /api/teams
      request: CreateTeamBody
      response: TeamItem
    - method: PUT
      path: '/api/teams/[id]'
      request: UpdateTeamBody
      response: TeamItem
    - method: DELETE
      path: '/api/teams/[id]'
      request: null
      response: '{ message: string }'
    - method: GET
      path: /api/players
      request: 'query: { team_id?, search?, page?, page_size? }'
      response: 'PlayerItem[]'
    - method: POST
      path: /api/players
      request: CreatePlayerBody
      response: PlayerItem
    - method: PUT
      path: '/api/players/[id]'
      request: UpdatePlayerBody
      response: PlayerItem
    - method: DELETE
      path: '/api/players/[id]'
      request: null
      response: '{ message: string }'
    - method: GET
      path: /api/trainings
      request: 'query: { date_from?, date_to?, page?, page_size? }'
      response: 'TrainingItem[]'
    - method: POST
      path: /api/trainings
      request: CreateTrainingBody
      response: TrainingItem
    - method: DELETE
      path: '/api/trainings/[id]'
      request: null
      response: '{ message: string }'
    - method: GET
      path: '/api/trainings/[id]'
      request: null
      response: TrainingDetail
    - method: POST
      path: '/api/trainings/[id]/ai/start'
      request: null
      response: '{ message: string }'
    - method: POST
      path: '/api/trainings/[id]/ai/stop'
      request: null
      response: '{ message: string }'
    - method: GET
      path: '/api/trainings/[id]/pitches'
      request: null
      response: 'PitchItem[]'
    - method: GET
      path: '/api/trainings/[id]/pitches/stream'
      request: null
      response: SSE stream
    - method: GET
      path: '/api/pitches/[id]'
      request: null
      response: PitchDetail
    - method: PUT
      path: '/api/trainings/[id]/strike-zone'
      request: UpdateStrikeZoneBody
      response: '{ message: string }'
    - method: GET
      path: /api/trainings/history
      request: 'query: { page?, page_size? }'
      response: 'TrainingItem[]'
    - method: POST
      path: /api/trainings/batch-delete
      request: BatchDeleteBody
      response: '{ message: string }'
    - method: GET
      path: '/api/trainings/[id]/analysis'
      request: null
      response: TrainingAnalysis
    - method: GET
      path: /api/analytics/players
      request: 'query: { page?, page_size? }'
      response: 'PlayerAnalyticsItem[]'
    - method: POST
      path: /api/analytics/players/batch-delete
      request: BatchDeletePlayersAnalysisBody
      response: '{ message: string }'
    - method: GET
      path: '/api/analytics/players/[id]'
      request: 'query: { period_start?, period_end? }'
      response: PlayerStatsData
    - method: GET
      path: /api/trainings/history/export
      request: 'query: { date_from?, date_to? }'
      response: CSV file download


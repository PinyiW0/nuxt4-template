      - POST /api/player-analysis/batch-delete
    components:
      - PageHeader
      - ListContainer
      - ConfirmModal
      - SearchInput
    store: auth

  # --- 選手統計 ---
  - path: '/analysis/:id'
    page: 'app/pages/analysis/[id].vue'
    layout: default
    features:
      - 26-查看選手統計.dsl.feature
    api_endpoints:
      - 'GET /api/players/:id/statistics'
    components: []
    store: auth

generated_at: 2026-02-11
version: 1

# 路由與 Feature 的對照關係
routes:
  # --- 認證相關 ---
  - path: /login
    page: app/pages/login.vue
    layout: auth
    features:
      - 01-使用者登入.dsl.feature
      - 02-使用者登出.dsl.feature
    api_endpoints:
      - POST /api/auth/login
      - POST /api/auth/logout
      - POST /api/auth/refresh
    components: []
    store: auth

  # --- 首頁 ---
  - path: /
    page: app/pages/index.vue
    layout: default
    features: []
    api_endpoints: []
    components: []
    store: null

  # --- 球隊管理 ---
  - path: /teams
    page: app/pages/teams/index.vue
    layout: default
    features:
      - 03-查詢球隊列表.dsl.feature
      - 04-建立球隊.dsl.feature
      - 05-編輯球隊.dsl.feature
      - 06-刪除球隊.dsl.feature
    api_endpoints:
      - GET /api/teams
      - POST /api/teams
      - 'PUT /api/teams/:id'
      - 'DELETE /api/teams/:id'
    components:
      - PageHeader
      - ListContainer
      - ConfirmModal
    store: auth

  # --- 球員管理 ---
  - path: /players
    page: app/pages/players/index.vue
    layout: default
    features:
      - 07-查詢球員列表.dsl.feature
      - 08-新增球員.dsl.feature
      - 09-編輯球員.dsl.feature
      - 10-刪除球員.dsl.feature
      - 11-調整球員排序.dsl.feature
    api_endpoints:
      - GET /api/players
      - POST /api/players
      - 'PUT /api/players/:id'
      - 'DELETE /api/players/:id'
      - PUT /api/players/sort
    components:
      - PageHeader
      - ListContainer
      - ConfirmModal
    store: auth

  # --- 訓練列表（未來訓練） ---
  - path: /trainings
    page: app/pages/trainings/index.vue
    layout: default
    features:
      - 12-查詢訓練列表.dsl.feature
      - 13-建立訓練.dsl.feature
      - 14-刪除訓練.dsl.feature
    api_endpoints:
      - GET /api/trainings
      - POST /api/trainings
      - 'DELETE /api/trainings/:id'
    components:
      - PageHeader
      - ListContainer
      - ConfirmModal
    store: auth

  # --- 訓練詳情（含投球清單 + AI 控制 + 好球帶） ---
  - path: '/trainings/:id'
    page: 'app/pages/trainings/[id]/index.vue'
    layout: default
    features:
      - 15-啟動AI系統.dsl.feature
      - 16-關閉AI系統.dsl.feature
      - 17-查看訓練紀錄.dsl.feature
      - 18-查詢投球清單.dsl.feature
      - 20-設定好球帶範圍.dsl.feature
    api_endpoints:
      - 'GET /api/trainings/:id'
      - 'GET /api/trainings/:id/pitches'
      - 'PUT /api/trainings/:id/strike-zone'
      - POST /api/ai/start
      - POST /api/ai/stop
      - GET /api/ai/status
    components:
      - PageHeader
    store: auth

  # --- 單球儀表板 ---
  - path: '/trainings/:id/pitches/:pitchId'
    page: 'app/pages/trainings/[id]/pitches/[pitchId].vue'
    layout: default
    features:
      - 19-查看單球儀表板.dsl.feature
    api_endpoints:
      - 'GET /api/trainings/:id/pitches/:pitchId'
    components: []
    store: null

  # --- 訓練分析 ---
  - path: '/trainings/:id/analysis'
    page: 'app/pages/trainings/[id]/analysis.vue'
    layout: default
    features:
      - 23-查看訓練分析.dsl.feature
    api_endpoints:
      - 'GET /api/trainings/:id/analysis'
    components: []
    store: auth

  # --- 歷史訓練列表（含批次刪除） ---
  - path: /trainings/history
    page: app/pages/trainings/history.vue
    layout: default
    features:
      - 21-查詢歷史訓練列表.dsl.feature
      - 22-批次刪除訓練.dsl.feature
    api_endpoints:
      - GET /api/trainings/history
      - POST /api/trainings/batch-delete
    components:
      - PageHeader
      - ListContainer
      - ConfirmModal
    store: auth

  # --- 選手分析列表（含批次刪除） ---
  - path: /analysis
    page: app/pages/analysis/index.vue
    layout: default
    features:
      - 24-查詢選手分析列表.dsl.feature
      - 25-批次刪除選手分析.dsl.feature
    api_endpoints:

      teamName: team_name
      status: status
      createdBy: created_by
      createdAt: created_at
      deletedBy: deleted_by
      deletedAt: deleted_at

  球員:
    entity_en: Player
    table: players
    primary_key: player_id
    fields:
      playerId: player_id
      teamId: team_id
      name: name
      jerseyNumber: jersey_number
      height: height
      position: position
      sortOrder: sort_order
      status: status

  訓練:
    entity_en: Training
    table: trainings
    primary_key: training_id
    fields:
      trainingId: training_id
      teamId: team_id
      playerId: player_id
      date: training_date
      strikeZoneHeight: strike_zone_height
      status: status
      createdBy: created_by
      createdAt: created_at
      deletedBy: deleted_by
      deletedAt: deleted_at

  投球:
    entity_en: Pitch
    table: pitches
    primary_key: pitch_id
    fields:
      pitchId: pitch_id
      trainingId: training_id
      speed: speed
      spinRate: spin_rate
      location: location
      result: result
      isStrike: is_strike

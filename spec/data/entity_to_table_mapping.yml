  好球帶:
    entity_en: StrikeZone
    table: strike_zones
    primary_key: strike_zone_id
    fields:
      strikeZoneId: strike_zone_id
      trainingId: training_id
      topHeight: top_height
      bottomHeight: bottom_height
      width: width

